# Phase 12 OIDC deployment pipeline
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: phase9/cloudops-self-healing/app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: phase9/cloudops-self-healing/app
        run: |
          pytest tests/ -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=ci \
            -t cloudops-dev-app:ci \
            ./phase9/cloudops-self-healing/app

      - name: Run Docker container
        run: |
          docker run -d \
            --name cloudops-test \
            -p 5000:5000 \
            cloudops-dev-app:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Application failed health check"
          docker logs cloudops-test
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker stop cloudops-test || true
          docker rm cloudops-test || true

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build release image
        working-directory: phase9/cloudops-self-healing/app
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.image_tag }} \
            -t ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.image_tag }} .

      - name: Push image to ECR
        run: |
          docker push \
            ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.image_tag }}

      - name: Deployment image summary
        run: |
          echo "### Image pushed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
