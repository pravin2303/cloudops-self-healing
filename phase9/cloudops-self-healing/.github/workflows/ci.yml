name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: app
        run: |
          pytest tests/ -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=ci \
            -t cloudops-dev-app:ci \
            ./app

      - name: Run Docker container
        run: |
          docker run -d \
            --name cloudops-test \
            -p 5000:5000 \
            cloudops-dev-app:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Application failed health check"
          docker logs cloudops-test
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker stop cloudops-test || true
          docker rm cloudops-test || true
